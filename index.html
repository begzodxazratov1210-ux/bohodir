<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .form-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .form-container h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #007bff;
            outline: none;
        }

        .submit-btn {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .submit-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Ro'yxatdan o'tish</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="fullname">Ism va Familiya</label>
                <input type="text" id="fullname" name="fullname" placeholder="Ismingizni kiriting" required>
            </div>

            <div class="form-group">
                <label for="address">Manzil</label>
                <textarea id="address" name="address" rows="3" placeholder="Yashash manzilingizni kiriting" required></textarea>
            </div>

            <div class="form-group">
                <label for="phone">Telefon raqam</label>
                <input type="tel" id="phone" name="phone" placeholder="+998 90 123 45 67" required>
            </div>

            <button type="submit" class="submit-btn">Yuborish</button>
        </form>
    </div>

</body>
</html>
